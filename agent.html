<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot – Super Bot 007</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<style>
:root {
  --p: #6C63FF; --s: #FF6584; --a: #43E97B;
  --dark: #03030A; --card: #0A0A1A; --border: rgba(108,99,255,0.22);
  --text: #E8E8FF; --muted: #7777AA;
  --grad: linear-gradient(135deg, var(--p), var(--s));
  --user-bg: linear-gradient(135deg, var(--p), var(--s));
  --bot-bg: #0D0D1F;
  --panel-bg: #06061A;
  --sidebar-w: 270px;
  --right-w: 295px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Inter', sans-serif; background: #000000; color: var(--text); overflow: hidden; }

/* Blink cursor */
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* BG CANVAS */
#bgCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* ══════ 3-COLUMN LAYOUT ══════ */
.app-shell {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr var(--right-w);
  height: 100vh;
}

/* ══════ LEFT PANEL ══════ */
.left-panel {
  background: rgba(8,8,22,0.98);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow-y: auto; overflow-x: hidden;
  backdrop-filter: blur(28px);
}
.left-panel::-webkit-scrollbar { width: 3px; }
.left-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.biz-header {
  padding: 1.5rem 1.2rem 1rem;
  background: linear-gradient(180deg, rgba(108,99,255,0.1) 0%, transparent 100%);
  border-bottom: 1px solid var(--border);
  text-align: center;
}
.biz-avatar {
  width: 74px; height: 74px; border-radius: 50%;
  background: var(--grad); display: flex; align-items: center;
  justify-content: center; font-size: 2rem; margin: 0 auto 0.75rem;
  overflow: hidden; border: 2px solid rgba(108,99,255,0.4);
  box-shadow: 0 0 0 0 rgba(108,99,255,0.4);
  transition: box-shadow 0.3s;
}
.biz-avatar.thinking {
  animation: avatarPulse 1.2s ease-in-out infinite;
}
@keyframes avatarPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(108,99,255,0.5); }
  50% { box-shadow: 0 0 0 12px rgba(108,99,255,0); }
}
.biz-avatar img { width: 100%; height: 100%; object-fit: cover; }
.biz-name { font-size: 1rem; font-weight: 800; color: var(--text); margin-bottom: 0.2rem; }
.biz-type { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
.online-badge {
  display: inline-flex; align-items: center; gap: 0.35rem;
  margin-top: 0.5rem; padding: 0.25rem 0.7rem;
  background: rgba(67,233,123,0.08); border: 1px solid rgba(67,233,123,0.22);
  border-radius: 20px; font-size: 0.7rem; color: var(--a); font-weight: 600;
}
.online-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--a); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

/* LEFT INFO SECTIONS */
.info-section { padding: 0.85rem 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
.info-section-title {
  font-size: 0.63rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: var(--muted); margin-bottom: 0.6rem;
  display: flex; align-items: center; gap: 0.4rem;
}
.info-row { display: flex; align-items: flex-start; gap: 0.6rem; margin-bottom: 0.45rem; font-size: 0.79rem; }
.info-row i { color: var(--p); font-size: 0.76rem; margin-top: 0.15rem; min-width: 14px; }
.info-row span { color: var(--text); line-height: 1.4; }
.info-row a { color: var(--p); text-decoration: none; }
.info-row a:hover { color: var(--s); }

/* HOURS */
.hours-grid { display: flex; flex-direction: column; gap: 0.28rem; }
.hours-row { display: flex; justify-content: space-between; font-size: 0.74rem; }
.hours-day { color: var(--muted); }
.hours-time { color: var(--text); font-weight: 500; }
.hours-closed { color: #FF4757; font-size: 0.71rem; }

/* SERVICE PILLS */
.service-pill {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.42rem 0.65rem; background: rgba(108,99,255,0.07);
  border: 1px solid rgba(108,99,255,0.13); border-radius: 10px; margin-bottom: 0.35rem;
  cursor: pointer; transition: all 0.2s;
}
.service-pill:hover { background: rgba(108,99,255,0.15); border-color: rgba(108,99,255,0.35); }
.service-pill-name { font-size: 0.77rem; font-weight: 600; color: var(--text); }
.service-pill-price { font-size: 0.71rem; color: var(--a); font-weight: 700; }

/* SOCIAL */
.social-links { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.3rem; }
.social-btn {
  width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-size: 0.88rem; border: 1px solid var(--border);
  background: rgba(255,255,255,0.04); color: var(--muted); cursor: pointer;
  text-decoration: none; transition: all 0.2s;
}
.social-btn:hover { border-color: var(--p); color: var(--p); background: rgba(108,99,255,0.1); }

/* PANEL ACTIONS */
.panel-actions { padding: 0.9rem 1rem; margin-top: auto; display: flex; flex-direction: column; gap: 0.45rem; }
.panel-action-btn {
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  padding: 0.55rem; border-radius: 10px; font-size: 0.79rem; font-weight: 700;
  border: none; cursor: pointer; text-decoration: none; transition: all 0.25s;
}
.panel-action-btn.wa { background: linear-gradient(135deg,#25D366,#128C7E); color: white; }
.panel-action-btn.wa:hover { box-shadow: 0 4px 18px rgba(37,211,102,0.4); transform: translateY(-1px); }
.panel-action-btn.landing { background: rgba(108,99,255,0.1); border: 1px solid var(--border); color: var(--text); }
.panel-action-btn.landing:hover { background: rgba(108,99,255,0.2); border-color: var(--p); }

/* ══════ CENTER CHAT ══════ */
.chat-col {
  display: flex; flex-direction: column;
  background: rgba(5,5,15,0.7);
  border-right: 1px solid var(--border);
  overflow: hidden; position: relative;
}

/* CHAT TOPBAR */
.chat-topbar {
  display: flex; align-items: center; gap: 0.8rem;
  padding: 0.8rem 1.1rem;
  background: rgba(10,10,25,0.97); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.chat-topbar-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--grad); display: flex; align-items: center;
  justify-content: center; font-size: 0.95rem; overflow: hidden;
  border: 1px solid var(--border); flex-shrink: 0;
}
.chat-topbar-avatar img { width: 100%; height: 100%; object-fit: cover; }
.chat-topbar-info { flex: 1; }
.chat-topbar-name { font-size: 0.88rem; font-weight: 700; }
.chat-topbar-status { font-size: 0.68rem; color: var(--a); display: flex; align-items: center; gap: 0.3rem; }
.chat-topbar-actions { display: flex; gap: 0.45rem; align-items: center; }
.topbar-btn {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
  background: rgba(255,255,255,0.04); color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; transition: all 0.2s; text-decoration: none;
}
.topbar-btn:hover { border-color: var(--p); color: var(--p); }

/* CART ICON IN TOPBAR */
.cart-topbar-btn {
  position: relative; width: 30px; height: 30px; border-radius: 8px;
  border: 1px solid rgba(255,101,132,0.35); background: rgba(255,101,132,0.08);
  color: var(--s); cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: 0.85rem; transition: all 0.2s;
}
.cart-topbar-btn:hover { background: rgba(255,101,132,0.18); border-color: var(--s); transform: scale(1.08); }
.cart-topbar-count {
  position: absolute; top: -5px; right: -5px;
  background: var(--s); color: white; width: 16px; height: 16px;
  border-radius: 50%; font-size: 0.6rem; font-weight: 800;
  display: none; align-items: center; justify-content: center;
  border: 1px solid var(--dark);
}
.cart-topbar-count.show { display: flex; }

/* QUICK BUTTONS */
.quick-btns {
  display: flex; gap: 0.4rem; padding: 0.5rem 0.9rem;
  overflow-x: auto; flex-shrink: 0;
  background: rgba(5,5,15,0.6);
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.quick-btns::-webkit-scrollbar { height: 0; }
.quick-btn {
  white-space: nowrap; padding: 0.32rem 0.75rem;
  background: rgba(108,99,255,0.09); border: 1px solid rgba(108,99,255,0.2);
  border-radius: 20px; color: var(--text); font-size: 0.73rem;
  font-weight: 600; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
}
.quick-btn:hover { background: rgba(108,99,255,0.22); border-color: var(--p); color: white; }
.quick-btn.products-btn {
  background: rgba(255,101,132,0.1); border-color: rgba(255,101,132,0.3); color: var(--s);
}
.quick-btn.products-btn:hover { background: rgba(255,101,132,0.2); border-color: var(--s); color: white; }

/* MESSAGES */
.messages {
  flex: 1; overflow-y: auto; padding: 1rem 1.1rem;
  display: flex; flex-direction: column; gap: 0.8rem;
}
.messages::-webkit-scrollbar { width: 3px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Message bubble */
.msg { display: flex; gap: 0.55rem; max-width: 88%; animation: msgIn 0.3s cubic-bezier(.25,.8,.25,1); }
.msg.bot.wide { max-width: 98%; }
@keyframes msgIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar {
  width: 28px; height: 28px; border-radius: 50%; background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.72rem; font-weight: 700; flex-shrink: 0; overflow: hidden;
}
.msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg-body { display: flex; flex-direction: column; gap: 0.18rem; }
.msg-bubble {
  padding: 0.68rem 0.92rem; border-radius: 18px;
  font-size: 0.86rem; line-height: 1.62; max-width: 100%; word-break: break-word;
}
.msg.bot .msg-bubble {
  background: var(--bot-bg); border: 1px solid var(--border);
  border-radius: 4px 18px 18px 18px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
}
.msg.user .msg-bubble {
  background: var(--user-bg); color: white;
  border-radius: 18px 4px 18px 18px;
  box-shadow: 0 2px 12px rgba(108,99,255,0.3);
}
.msg-time { font-size: 0.63rem; color: var(--muted); padding: 0 3px; }
.msg.user .msg-time { text-align: right; }

/* Typing */
.typing {
  display: flex; gap: 5px; align-items: center; padding: 0.68rem 0.92rem;
  background: var(--bot-bg); border: 1px solid var(--border);
  border-radius: 4px 18px 18px 18px; width: fit-content;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
}
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--p); animation: typingDot 1.3s infinite; }
.typing span:nth-child(2) { animation-delay: 0.22s; background: var(--s); }
.typing span:nth-child(3) { animation-delay: 0.44s; background: var(--a); }
@keyframes typingDot { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-7px);opacity:1} }

/* Action buttons in messages */
.msg-actions { display: flex; flex-wrap: wrap; gap: 0.38rem; margin-top: 0.5rem; }
.msg-action {
  padding: 0.32rem 0.78rem; background: rgba(108,99,255,0.1);
  border: 1px solid rgba(108,99,255,0.25); border-radius: 20px;
  font-size: 0.73rem; color: var(--text); cursor: pointer; transition: all 0.2s;
}
.msg-action:hover { background: var(--grad); border-color: transparent; color: white; transform: translateY(-1px); }

/* PRODUCT CARDS IN CHAT */
.products-grid-chat {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem;
  margin-top: 0.5rem; max-width: 380px;
}
.prod-card-chat {
  background: linear-gradient(145deg, #0F0F24, #151530);
  border: 1px solid var(--border); border-radius: 14px;
  overflow: hidden; transition: all 0.25s; cursor: default;
}
.prod-card-chat:hover { border-color: rgba(108,99,255,0.45); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
.prod-card-img {
  width: 100%; height: 75px; background: linear-gradient(135deg, rgba(108,99,255,0.15), rgba(255,101,132,0.15));
  display: flex; align-items: center; justify-content: center; font-size: 1.8rem;
  overflow: hidden;
}
.prod-card-img img { width: 100%; height: 100%; object-fit: cover; }
.prod-card-body { padding: 0.55rem 0.6rem; }
.prod-card-name { font-size: 0.75rem; font-weight: 700; margin-bottom: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prod-card-price { font-size: 0.82rem; font-weight: 800; color: var(--s); margin-bottom: 0.4rem; }
.prod-card-add {
  width: 100%; padding: 0.35rem 0; background: rgba(108,99,255,0.15);
  border: 1px solid rgba(108,99,255,0.3); border-radius: 8px;
  color: var(--text); font-size: 0.7rem; font-weight: 700; cursor: pointer;
  transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.3rem;
}
.prod-card-add:hover { background: var(--grad); border-color: transparent; color: white; }

/* ══════ FLOATING CART ══════ */
.cart-float {
  position: absolute; bottom: 80px; right: 12px; z-index: 200;
}
.cart-float-btn {
  width: 48px; height: 48px; background: var(--grad); border: none;
  border-radius: 50%; color: white; font-size: 1.1rem; cursor: pointer;
  box-shadow: 0 4px 20px rgba(108,99,255,0.55); transition: all 0.3s;
  display: flex; align-items: center; justify-content: center; position: relative;
}
.cart-float-btn:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(108,99,255,0.7); }
.cart-float-badge {
  position: absolute; top: -4px; right: -4px;
  background: var(--s); color: white; width: 18px; height: 18px;
  border-radius: 50%; font-size: 0.62rem; font-weight: 800;
  display: none; align-items: center; justify-content: center;
  border: 2px solid var(--dark); animation: badgePop 0.3s cubic-bezier(.25,.8,.25,1);
}
.cart-float-badge.show { display: flex; }
@keyframes badgePop { from{transform:scale(0)} to{transform:scale(1)} }

/* CART DRAWER */
.cart-drawer {
  position: absolute; bottom: 0; right: 0; left: 0; z-index: 300;
  background: linear-gradient(180deg, #0D0D22 0%, #08081A 100%);
  border-top: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  transform: translateY(100%); transition: transform 0.38s cubic-bezier(.25,.8,.25,1);
  max-height: 70vh; display: flex; flex-direction: column;
  box-shadow: 0 -8px 40px rgba(0,0,0,0.6);
}
.cart-drawer.open { transform: translateY(0); }
.cart-drawer-handle {
  width: 36px; height: 4px; background: rgba(255,255,255,0.15);
  border-radius: 2px; margin: 0.7rem auto 0;
}
.cart-drawer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.8rem 1.2rem 0.6rem;
  border-bottom: 1px solid var(--border);
}
.cart-drawer-title { font-size: 1rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
.cart-drawer-close {
  width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border);
  background: rgba(255,255,255,0.04); color: var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
  transition: all 0.2s;
}
.cart-drawer-close:hover { background: rgba(255,71,87,0.15); border-color: #FF4757; color: #FF4757; }
.cart-drawer-items { flex: 1; overflow-y: auto; padding: 0.7rem 1rem; display: flex; flex-direction: column; gap: 0.55rem; }
.cart-drawer-items::-webkit-scrollbar { width: 3px; }
.cart-item-row {
  display: flex; align-items: center; gap: 0.65rem;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 12px; padding: 0.55rem 0.7rem;
}
.cart-item-thumb {
  width: 42px; height: 42px; border-radius: 8px; flex-shrink: 0;
  background: linear-gradient(135deg, rgba(108,99,255,0.2), rgba(255,101,132,0.2));
  display: flex; align-items: center; justify-content: center; font-size: 1.2rem; overflow: hidden;
}
.cart-item-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
.cart-item-info { flex: 1; }
.cart-item-name { font-size: 0.82rem; font-weight: 600; }
.cart-item-price { font-size: 0.78rem; color: var(--s); font-weight: 700; }
.cart-item-qty {
  display: flex; align-items: center; gap: 0.35rem;
}
.qty-btn {
  width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border);
  background: rgba(255,255,255,0.06); color: var(--text); cursor: pointer;
  font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.qty-btn:hover { background: rgba(108,99,255,0.2); border-color: var(--p); }
.qty-num { font-size: 0.82rem; font-weight: 700; min-width: 16px; text-align: center; }
.cart-rm-btn {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 0.9rem; transition: color 0.2s; padding: 0.2rem;
}
.cart-rm-btn:hover { color: #FF4757; }
.cart-drawer-footer { padding: 0.8rem 1rem; border-top: 1px solid var(--border); }
.cart-total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.7rem; }
.cart-total-label { font-size: 0.82rem; color: var(--muted); }
.cart-total-amount { font-size: 1.2rem; font-weight: 800; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.cart-checkout-btns { display: flex; flex-direction: column; gap: 0.45rem; }
.cart-pay-btn {
  width: 100%; padding: 0.7rem; border: none; border-radius: 12px;
  font-weight: 800; font-size: 0.88rem; cursor: pointer; transition: all 0.25s;
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
}
.cart-pay-btn.paypal { background: linear-gradient(135deg,#0070BA,#003087); color: white; box-shadow: 0 4px 16px rgba(0,112,186,0.4); }
.cart-pay-btn.paypal:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(0,112,186,0.55); }
.cart-pay-btn.wa { background: linear-gradient(135deg,#25D366,#128C7E); color: white; box-shadow: 0 4px 16px rgba(37,211,102,0.35); }
.cart-pay-btn.wa:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(37,211,102,0.5); }
.cart-empty-msg { text-align: center; padding: 1.5rem; color: var(--muted); font-size: 0.85rem; }

/* INPUT AREA */
.input-area {
  padding: 0.75rem 0.9rem; background: rgba(10,10,25,0.97);
  border-top: 1px solid var(--border);
  display: flex; gap: 0.55rem; align-items: flex-end; flex-shrink: 0;
}
.input-wrap {
  flex: 1; display: flex; align-items: flex-end; gap: 0.4rem;
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  border-radius: 14px; padding: 0.42rem 0.72rem; transition: border-color 0.3s;
}
.input-wrap:focus-within { border-color: var(--p); background: rgba(108,99,255,0.06); }
#userInput {
  flex: 1; background: none; border: none; color: var(--text);
  font-family: 'Inter',sans-serif; font-size: 0.87rem; outline: none;
  resize: none; max-height: 120px; min-height: 22px; line-height: 1.5;
}
#userInput::placeholder { color: var(--muted); }
.send-btn {
  width: 38px; height: 38px; background: var(--grad); border: none;
  border-radius: 10px; color: white; font-size: 0.88rem; cursor: pointer;
  transition: all 0.3s; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; box-shadow: 0 4px 14px rgba(108,99,255,0.45);
}
.send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(108,99,255,0.6); }
.send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

/* ══════ RIGHT PANEL ══════ */
.right-panel {
  background: rgba(8,8,22,0.98);
  display: flex; flex-direction: column;
  overflow-y: auto; overflow-x: hidden;
  backdrop-filter: blur(28px);
}
.right-panel::-webkit-scrollbar { width: 3px; }
.right-panel::-webkit-scrollbar-thumb { background: var(--border); }
.right-header {
  padding: 1.1rem 1.1rem 0.75rem;
  background: linear-gradient(180deg, rgba(255,101,132,0.08) 0%, transparent 100%);
  border-bottom: 1px solid var(--border); text-align: center;
}
.right-title { font-size: 0.93rem; font-weight: 800; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.18rem; }

<script>
// ══════ AUDIO ENGINE ══════
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let soundEnabled = true;
let lastTypeSnd = 0;

function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new AudioCtx(); }catch(e){}
  }
  return audioCtx;
}

function playTypingSound(){
  if(!soundEnabled) return;
  const now = Date.now();
  if(now - lastTypeSnd < 80) return; // throttle
  lastTypeSnd = now;
  try{
    const ctx = getAudioCtx(); if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(900 + Math.random()*200, ctx.currentTime);
    gain.gain.setValueAtTime(0.04, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.06);
  }catch(e){}
}

function playReceiveSound(){
  if(!soundEnabled) return;
  try{
    const ctx = getAudioCtx(); if(!ctx) return;
    [0, 0.12].forEach((delay, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(i===0?660:880, ctx.currentTime+delay);
      gain.gain.setValueAtTime(0.12, ctx.currentTime+delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+delay+0.18);
      osc.start(ctx.currentTime+delay);
      osc.stop(ctx.currentTime+delay+0.18);
    });
  }catch(e){}
}

function playCartSound(){
  if(!soundEnabled) return;
  try{
    const ctx = getAudioCtx(); if(!ctx) return;
    [0,0.1,0.2].forEach((delay,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'triangle';
      const freqs = [523,659,784];
      osc.frequency.setValueAtTime(freqs[i], ctx.currentTime+delay);
      gain.gain.setValueAtTime(0.1, ctx.currentTime+delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+delay+0.15);
      osc.start(ctx.currentTime+delay);
      osc.stop(ctx.currentTime+delay+0.15);
    });
  }catch(e){}
}
</script>

<script>
// ══════ STATE ══════
let botData = null;
let messages = [];
let isTyping = false;
let appointmentMode = false;
let cart = [];
const botId = new URLSearchParams(location.search).get('id');

// ══════ PARTICLES (black deep bg) ══════
(function(){
  const c=document.getElementById('bgCanvas'),ctx=c.getContext('2d');
  let W,H,pts=[];
  function resize(){ W=c.width=window.innerWidth; H=c.height=window.innerHeight; }
  resize(); window.addEventListener('resize',resize);
  const colors=['rgba(108,99,255,','rgba(255,101,132,','rgba(67,233,123,'];
  for(let i=0;i<55;i++) pts.push({
    x:Math.random()*W, y:Math.random()*H,
    vx:(Math.random()-.5)*.28, vy:(Math.random()-.5)*.28,
    r:Math.random()*1.6+.3,
    a:Math.random()*.14+.03,
    c:colors[Math.floor(Math.random()*colors.length)]
  });
  (function draw(){
    // Pure black deep feel
    ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,0,W,H);
    pts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0; if(p.y<0)p.y=H; if(p.y>H)p.y=0;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.c+p.a+')'; ctx.fill();
    });
    requestAnimationFrame(draw);
  })();
})();

// ══════ INIT ══════
window.addEventListener('DOMContentLoaded', ()=>{
  if(!botId){
    document.getElementById('initBanner').innerHTML='';
    addBotMsg('❌ No se especificó Bot ID. Usa <strong>?id=TU_BOT_ID</strong> en la URL.');
    return;
  }
  document.getElementById('landingBtn').href = `landing.html?id=${botId}`;
  loadBot();
});

// ══════ PARSE BOT (normaliza datos viejos y nuevos) ══════
function parseBot(raw){
  if(!raw) return {};
  const d = Object.assign({}, raw);
  // --- Asegurar que arrays sean arrays ---
  ['services','products','testimonials','faqs'].forEach(k=>{
    if(!Array.isArray(d[k])) d[k] = [];
  });
  if(!Array.isArray(d.galleryURLs)) d.galleryURLs = [];
  // --- Normalizar número WhatsApp: si no hay whatsapp usar phone ---
  if(!d.whatsapp && d.phone) d.whatsapp = d.phone.replace(/\D/g,'');
  // --- Fallbacks de texto ---
  d.businessName  = d.businessName  || d.name        || '';
  d.description   = d.description   || d.desc        || d.about || '';
  d.heroTitle     = d.heroTitle     || d.businessName || '';
  d.phone         = d.phone         || d.whatsapp     || '';
  d.city          = d.city          || d.businessCity || '';
  // --- Sanitizar servicios: si son strings (bots viejos) convertir a objeto ---
  d.services = d.services.map(s=>{
    if(typeof s === 'string') return { name:s, price:'', desc:'' };
    return s;
  });
  // --- Sanitizar faqs ---
  d.faqs = d.faqs.filter(f=> f && (f.q||f.question));
  d.faqs = d.faqs.map(f=>({ q: f.q||f.question||'', a: f.a||f.answer||'' }));
  return d;
}

async function loadBot(){
  try{
    await waitFor(()=>window.db);
    const snap = await window.fbGetDoc(window.fbDoc(window.db,'bots',botId));
    if(!snap.exists()){
      document.getElementById('initBanner').textContent='';
      addBotMsg('❌ Bot no encontrado. Verifica el ID.');
      return;
    }
    botData = parseBot(snap.data());
    initChat();
  }catch(e){
    document.getElementById('initBanner').textContent='';
    addBotMsg('Error al cargar: '+e.message);
    console.error(e);
  }
}

// ══════ CART ══════
function addToCart(product){
  // Check if already in cart
  const existing = cart.find(i=>i.name===product.name);
  if(existing){
    existing.qty = (existing.qty||1) + 1;
  } else {
    cart.push({...product, qty:1});
  }
  updateCartUI();
  playCartSound();
  toast(`🛒 ${product.name} agregado al carrito`, 'success');
  // NO abrimos el drawer — el cliente sigue agregando productos libremente
}

function removeFromCart(idx){
  cart.splice(idx,1);
  updateCartUI();
}

function changeQty(idx, delta){
  cart[idx].qty = (cart[idx].qty||1) + delta;
  if(cart[idx].qty <= 0) cart.splice(idx,1);
  updateCartUI();
}

function updateCartUI(){
  const total = cart.reduce((s,i)=>s+parseFloat(i.price||0)*(i.qty||1),0);
  const count = cart.reduce((s,i)=>s+(i.qty||1),0);

  // Badge
  const badge = document.getElementById('cartFloatBadge');
  const topBadge = document.getElementById('cartTopbarCount');
  if(count > 0){
    badge.textContent = count; badge.classList.add('show');
    topBadge.textContent = count; topBadge.classList.add('show');
  } else {
    badge.classList.remove('show');
    topBadge.classList.remove('show');
  }

  // Drawer items
  const itemsEl = document.getElementById('cartDrawerItems');
  const icons = ['🧴','💊','🎁','🌿','✨','💎','🛍️','🌸'];
  if(!cart.length){
    itemsEl.innerHTML = `<div class="cart-empty-msg">🛒<br>Tu carrito está vacío.<br><small>Agrega productos desde el chat.</small></div>`;
  } else {
    itemsEl.innerHTML = cart.map((item,i)=>`
      <div class="cart-item-row">
        <div class="cart-item-thumb">${item.image?`<img src="${item.image}" alt="${item.name}">`:(icons[i%icons.length])}</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-price">$${(parseFloat(item.price||0)*(item.qty||1)).toFixed(2)}</div>
        </div>
        <div class="cart-item-qty">
          <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
          <span class="qty-num">${item.qty||1}</span>
          <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
        </div>
        <button class="cart-rm-btn" onclick="removeFromCart(${i})"><i class="fas fa-times"></i></button>
      </div>`).join('');
  }

  // Total
  document.getElementById('cartTotalAmount').textContent = '$'+total.toFixed(2);

  // Checkout buttons
  const d = botData || {};
  const btns = document.getElementById('cartCheckoutBtns');
  if(cart.length > 0){
    const paypalBtn = (d.paypalLink || d.paypalEmail)
      ? `<button class="cart-pay-btn paypal" onclick="checkoutPayPal()"><i class="fab fa-paypal"></i> Pagar con PayPal</button>`
      : '';
    const waBtn = d.whatsapp || d.phone
      ? `<button class="cart-pay-btn wa" onclick="checkoutWhatsApp()"><i class="fab fa-whatsapp"></i> Pagar por WhatsApp</button>`
      : '';
    btns.innerHTML = paypalBtn + waBtn;
    if(!paypalBtn && !waBtn){
      btns.innerHTML = `<p style="color:var(--muted);font-size:0.78rem;text-align:center;">Contacta al negocio para coordinar el pago.</p>`;
    }
  } else {
    btns.innerHTML = '';
  }
}

function openCartDrawer(){

function checkoutPayPal(){
  const d = botData || {};
  const total = cart.reduce((s,i)=>s+parseFloat(i.price||0)*(i.qty||1),0).toFixed(2);
  const itemNames = cart.map(i=>`${i.name}${i.qty>1?' x'+i.qty:''}`).join(', ');
  if(d.paypalLink && d.paypalLink.includes('paypal')){
    window.open(d.paypalLink, '_blank');
  } else if(d.paypalEmail){
    const url = `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=${encodeURIComponent(d.paypalEmail)}&item_name=${encodeURIComponent(itemNames)}&amount=${total}&currency_code=USD`;
    window.open(url, '_blank');
  }
  addBotMsgTypewriter(`¡Genial! 🎉 Te redirigí a PayPal para completar tu compra de **$${total}**. Una vez que pagues, ¡queda todo listo! ¿Necesitas algo más? 🙌`);
}

function checkoutWhatsApp(){
  const d = botData || {};
  const total = cart.reduce((s,i)=>s+parseFloat(i.price||0)*(i.qty||1),0).toFixed(2);
  const itemLines = cart.map(i=>`• ${i.name}${i.qty>1?' x'+i.qty:''} – $${(parseFloat(i.price||0)*(i.qty||1)).toFixed(2)}`).join('\n');
  const wa = (d.whatsapp||d.phone||'').replace(/\D/g,'');
  const msg = `Hola ${d.businessName||''}! Quiero hacer un pedido:\n\n${itemLines}\n\n💰 *Total: $${total}*\n\n_Pedido via Super Bot 007_`;
  const url = wa ? `https://wa.me/${wa}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
  addBotMsgTypewriter(`¡Listo! 📲 Te preparé el pedido para enviarlo por WhatsApp. Ahí te coordinan el pago — ¡es rapidísimo! ¿Algo más en lo que pueda ayudarte? 😊`);
}

// Flow: Step 1 = Datos, Step 2 = Fecha, Step 3 = Hora (igual que landing.html)
let bkState = { step:1, date:null, time:null, calYear:null, calMonth:null,
                name:'', phone:'', email:'', service:'', note:'' };

function buildRightBookingForm(d){

function renderBookingStep(d){
  const panel = document.getElementById('bookingPanel');
  if(!panel) return;
  const isEN = d.botLanguage==='en';
  const labels = {
    appt:    isEN?'Book Appointment':'Agendar Cita',
    pick:    isEN?'Pick a date':'Elige una fecha',
    pickT:   isEN?'Pick a time':'Elige un horario',
    info:    isEN?'Your info':'Tus datos',
    next:    isEN?'Next →':'Siguiente →',
    confirm: isEN?'Confirm Appointment':'Confirmar Cita',
    waBtn:   isEN?'Confirm via WhatsApp':'Confirmar por WhatsApp',
    name:    isEN?'Full name *':'Nombre completo *',
    phone:   isEN?'Phone *':'Teléfono *',
    email:   isEN?'Email (optional)':'Email (opcional)',
    service: isEN?'Service':'Servicio',
    selSvc:  isEN?'Select a service...':'Selecciona un servicio...',
    notes:   isEN?'Notes (optional)':'Notas (opcional)',
    notesP:  isEN?'Allergies, preferences...':'Alergias, preferencias...',
    back:    isEN?'← Back':'← Atrás',
    selDate: isEN?'Select date first':'Primero elige una fecha',
    noSlots: isEN?'No slots available':'Sin horarios disponibles',

  };

  if(bkState.step===1) panel.innerHTML = buildInfoHTML(d, labels);
  else if(bkState.step===2) panel.innerHTML = buildCalendarHTML(d, labels);
  else if(bkState.step===3) panel.innerHTML = buildTimeHTML(d, labels);
}

function stepsHTML(step){
  const isEN = botData?.botLanguage==='en';
  const steps=['👤','📅','🕐'];
  const names = isEN?['Info','Date','Time']:['Datos','Fecha','Hora'];
  return `<div class="bk-steps">
    ${steps.map((s,i)=>{
      const cls = i+1<step?'done':i+1===step?'active':'';
      const line = i<2?(i+1<step?'done':''):'';
      return `<div class="bk-step-dot ${cls}"><span>${i+1<step?'✓':s}</span>${names[i]}</div>${i<2?`<div class="bk-step-line ${line}"></div>`:''}`;
    }).join('')}
  </div>`;
}

function buildCalendarHTML(d, labels){
  const DAYS_EN = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const DAYS_ES = ['Do','Lu','Ma','Mi','Ju','Vi','Sa'];
  const MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const isEN = d.botLanguage==='en';
  const dowLabels = isEN?DAYS_EN:DAYS_ES;
  const monthNames = isEN?MONTHS_EN:MONTHS_ES;

  const y = bkState.calYear, m = bkState.calMonth;
  const firstDay = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);

  // Map day-of-week to hours key
  const DOW_KEY = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  const hours = d.hours||{};

  let cells = '';
  // Empty cells before first day
  for(let i=0;i<firstDay;i++) cells+=`<div class="bk-cal-day empty"></div>`;
  for(let day=1;day<=daysInMonth;day++){
    const dt = new Date(y,m,day);
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isPast = dt < today;
    const dow = dt.getDay();
    const key = DOW_KEY[dow];
    const hData = hours[key]||hours[Object.keys(hours)[dow]]||null;
    const isClosed = hData && !hData.open;
    const isToday = dt.getTime()===today.getTime();
    const isSel = bkState.date===dateStr;
    let cls = 'bk-cal-day';
    if(isPast||isClosed) cls+= isPast?' disabled':' closed';
    else if(isSel) cls+=' selected';
    else if(isToday) cls+=' today';
    const clickable = !isPast && !isClosed;
    cells+=`<div class="${cls}" ${clickable?`onclick="bkPickDate('${dateStr}',this)"`:''}>${day}</div>`;
  }

  const prevDisabled = (y===today.getFullYear()&&m<=today.getMonth());
  return `
    ${stepsHTML(2)}
    <div class="bk-section-title">📅 ${labels.pick}</div>
    <div class="bk-cal-nav">
      <button onclick="bkCalNav(-1)" ${prevDisabled?'disabled style="opacity:0.3;cursor:not-allowed"':''}>‹</button>
      <span class="bk-cal-month">${monthNames[m]} ${y}</span>
      <button onclick="bkCalNav(1)">›</button>
    </div>
    <div class="bk-cal-grid">
      ${dowLabels.map(d=>`<div class="bk-cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    <div class="bk-nav-btns" style="margin-top:0.8rem;">
      <button class="bk-back-btn" onclick="bkGoStep1()">${labels.back}</button>
      <button class="bk-next-btn" onclick="bkGoStep3()" ${bkState.date?'':'style="opacity:0.5;cursor:not-allowed"'}>
        ${bkState.date?labels.next:labels.selDate}
      </button>
    </div>`;
}

function buildTimeHTML(d, labels){
  const hours = d.hours||{};
  const DOW_KEY = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  let timeSlots = [];

  if(bkState.date){
    const dt = new Date(bkState.date+'T12:00:00');
    const key = DOW_KEY[dt.getDay()];
    const hData = hours[key]||null;
    if(hData && hData.open && hData.from && hData.to){
      const [fh,fm] = hData.from.split(':').map(Number);
      const [th,tm] = hData.to.split(':').map(Number);
      let cur = fh*60+(fm||0);
      const end = th*60+(tm||0);
      while(cur+30<=end){
        const hh=Math.floor(cur/60), mm=cur%60;
        const suffix=hh>=12?'pm':'am', h12=hh%12||12;
        timeSlots.push(`${h12}:${String(mm).padStart(2,'0')}${suffix}`);
        cur+=30;
      }
    }
  }
  if(!timeSlots.length) timeSlots=['9:00am','9:30am','10:00am','10:30am','11:00am','11:30am','12:00pm','12:30pm','1:00pm','1:30pm','2:00pm','2:30pm','3:00pm','3:30pm','4:00pm','4:30pm','5:00pm'];

  const [yr,mo,dy] = bkState.date.split('-');
  const dateLabel = `${dy}/${mo}/${yr}`;

  const hasContact = !!(d.whatsapp||d.phone);
  return `
    ${stepsHTML(3)}
    ${bkState.date?`<div class="bk-selected-badge">📅 ${dateLabel}</div>`:''}
    <div class="bk-section-title">🕐 ${labels.pickT}</div>
    <div class="bk-time-grid">
      ${timeSlots.map(t=>`<div class="bk-time-slot${bkState.time===t?' selected':''}" onclick="bkPickTime('${t}',this)">${t}</div>`).join('')}
    </div>
    <div id="bkConfirmBtns" style="${bkState.time?'':'display:none'}">
      <button class="bk-btn wa" style="margin-top:0.8rem;width:100%" onclick="submitBookingRight('wa')">
        <i class="fab fa-whatsapp"></i> ${labels.waBtn}
      </button>
      <div class="bk-nav-btns" style="margin-top:0.5rem">
        <button class="bk-back-btn" onclick="bkGoStep2()">${labels.back}</button>
      </div>
    </div>
    <div id="bkBackOnly" style="${bkState.time?'display:none':''}">
      <div class="bk-nav-btns" style="margin-top:0.6rem">
        <button class="bk-back-btn" onclick="bkGoStep2()">${labels.back}</button>

// ══════ SEND MESSAGE ══════
async function sendMessage(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text || isTyping) return;
  input.value = ''; input.style.height='auto';

  // Unlock audio on first interaction
  getAudioCtx();

  addUserMsg(text);
  messages.push({ role:'user', content:text });

  // Check for product/shopping intent
  if(isShoppingIntent(text) && botData?.products?.length > 0){
    showProductsInChat();
    addBotMsgTypewriter('¡Aquí arriba te muestro lo que tenemos disponible! 👆 Puedes agregar lo que quieras al carrito y pagar con PayPal o WhatsApp. ¿Ves algo que te guste? 😍', ['¿Tienen descuentos?', '¿Cómo pago?', 'Prefiero un servicio']);
    return;
  }

  // Appointment intent
  if(isAppointmentIntent(text) && !appointmentMode){
    appointmentMode = true;
    addBotMsgTypewriter('¡Claro que sí! 😊 Puedes usar el formulario de citas 👉 a la derecha — es súper rápido. Solo pon tu nombre, teléfono y el servicio que quieres. ¿Tienes alguna fecha en mente?', ['Ver servicios disponibles', '¿Cuánto cuesta?']);
    return;
  }

  const typingId = showTyping();
  isTyping = true;
  document.getElementById('sendBtn').disabled = true;
  setAvatarThinking(true);

  try{
    const response = await callGPT(messages);
    removeTyping(typingId);
    isTyping = false;
    document.getElementById('sendBtn').disabled = false;
    setAvatarThinking(false);
    if(response){
      messages.push({ role:'assistant', content:response });
      addBotMsgTypewriter(response);
    }
  }catch(e){
    removeTyping(typingId);
    isTyping = false;
    document.getElementById('sendBtn').disabled = false;
    setAvatarThinking(false);
    addBotMsgTypewriter('Lo siento, algo salió mal. ¡Intenta de nuevo! 😊');
  }
}

function sendQuick(msg){
  document.getElementById('userInput').value = msg;
  sendMessage();
}

function setAvatarThinking(active){
  const av = document.getElementById('bizAvatarEl');
  if(active) av.classList.add('thinking');
  else av.classList.remove('thinking');
}

// ══════ GPT CALL ══════
async function callGPT(msgs){
  const key = botData?.openaiKey;
  const model = botData?.gptModel || 'gpt-4o-mini';
  if(!key) return fallbackResponse(msgs[msgs.length-1].content);
  const res = await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body: JSON.stringify({ model, messages: msgs, max_tokens:520, temperature:0.82 })
  });
  if(!res.ok){ const err=await res.json(); throw new Error(err.error?.message||'API error'); }
  const data = await res.json();
  return data.choices?.[0]?.message?.content?.trim();
}

    const open = Object.entries(d.hours||{}).filter(([,h])=>h&&h.open);

      const opts=[

        `El horario lo confirma el equipo directamente. ¿Te paso al WhatsApp para que te digan cuándo hay disponibilidad? 📱`

    }
    const hrs = open.map(([day,h])=>`📅 **${day}:** ${h.from} – ${h.to}`).join('\n');
    const opts=[
      `¡Aquí tienes el horario! ⏰\n\n${hrs}\n\n¿Quieres apartar un lugar en alguno de esos días? 😊`,
      `Los horarios de ${name} son:\n\n${hrs}\n\n¿Hay algún día que te quede bien? 📅`,

  if(lower.includes('precio') || lower.includes('costo') || lower.includes('cuanto') || lower.includes('cuánto') || lower.includes('vale') || lower.includes('cobran') || lower.includes('tarifa') || lower.includes('cuánto cuesta') || lower.includes('cuanto cuesta')){

      `Aquí los precios actuales:\n\n${s||'Los precios varían — escríbenos y te hacemos una cotización sin compromiso 😊'}\n\n¿Cuál te interesa más?`
    ];
    return opts[Math.floor(Math.random()*opts.length)];
  }
  if(lower.includes('donde') || lower.includes('dirección') || lower.includes('ubicación') || lower.includes('están') || lower.includes('cómo llegar') || lower.includes('como llegar') || lower.includes('domicilio')){

  const k=['cita','reserva','agendar','appointment','book','reservar','quiero ir','programar','apartar','separar lugar','pedir turno','turno','quiero una cita','me gustaría ir'];

}

// ══════ TYPEWRITER BOT MESSAGE ══════
function addBotMsgTypewriter(text, actions=[]){
  const div = document.createElement('div');
  div.className = 'msg bot';
  const avatarHtml = botData?.botAvatar
    ? `<div class="msg-avatar"><img src="${botData.botAvatar}" alt="bot"></div>`
    : `<div class="msg-avatar">🤖</div>`;
  const actionsHtml = actions.length
    ? `<div class="msg-actions" id="msgAct_${Date.now()}" style="display:none">${actions.map(a=>`<button class="msg-action" onclick="sendQuick('${a.replace(/'/g,"&#39;")}')">${a}</button>`).join('')}</div>`
    : '';
  const bubbleId = 'bubble_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);

  div.innerHTML = `${avatarHtml}
    <div class="msg-body">
      <div class="msg-bubble" id="${bubbleId}"></div>
      <div class="msg-time">${getTime()}</div>
    </div>`;

  document.getElementById('messages').appendChild(div);
  scrollToBottom();

  // Typewriter effect
  const bubble = document.getElementById(bubbleId);
  const formatted = formatText(text);
  // Strip HTML tags for character counting, then re-render
  const plainLen = text.length;
  let charIndex = 0;
  let displayText = '';

  const interval = setInterval(()=>{
    if(charIndex < text.length){
      displayText += text[charIndex];
      bubble.innerHTML = formatText(displayText) + '<span class="tw-cursor" style="display:inline-block;width:2px;height:1em;background:var(--p);margin-left:2px;animation:blink 0.7s infinite;vertical-align:middle;border-radius:1px;"></span>';
      charIndex++;
      scrollToBottom();
    } else {
      clearInterval(interval);
      bubble.innerHTML = formatted + (actionsHtml ? actionsHtml : '');
      // Show actions
      if(actionsHtml){
        const actDiv = bubble.querySelector('.msg-actions');
        if(actDiv) actDiv.style.display='flex';
      }
      playReceiveSound();
      scrollToBottom();
    }
  }, 18); // speed of typewriter

  return div;
}

async function submitApptForm(formId){
  const name=document.getElementById(formId+'_name')?.value.trim();
  const phone=document.getElementById(formId+'_phone')?.value.trim();
  const email=document.getElementById(formId+'_email')?.value.trim();
  const service=document.getElementById(formId+'_service')?.value;
  const date=document.getElementById(formId+'_date')?.value;
  const time=document.getElementById(formId+'_time')?.value;
  const note=document.getElementById(formId+'_note')?.value.trim();
  if(!name){ document.getElementById(formId+'_name').focus(); toast('Ingresa tu nombre','error'); return; }
  if(!phone){ document.getElementById(formId+'_phone').focus(); toast('Ingresa tu teléfono','error'); return; }
  try{ if(window.db) await window.fbAddDoc(window.fbCollection(window.db,'appointments'),{botId:botId||'',businessName:botData?.businessName||'',name,phone,email,service,date,time,note,createdAt:Date.now(),status:'pending',source:'chatbot-form'}); }catch(e){}
  const form=document.getElementById(formId);
  if(form) form.innerHTML=`<div class="appt-success"><div class="check-icon">✅</div><strong>¡Cita agendada!</strong><p>Hola <strong>${name}</strong>, tu solicitud está registrada${service?' para <strong>'+service+'</strong>':''}${date?' el <strong>'+date+'</strong>':''}.</p><p>Te contactamos al <strong>${phone}</strong> 😊</p></div>`;
  appointmentMode=false;
  addBotMsgTypewriter(`¡Listo, ${name}! 🎉 Tu cita quedó registrada. Te vamos a contactar al ${phone} para confirmar. ¿Algo más en lo que pueda ayudarte? 😊`);
  scrollToBottom();
}

  try{ if(window.db) await window.fbAddDoc(window.fbCollection(window.db,'appointments'),{botId:botId||'',businessName:botData?.businessName||'',name,phone,email,service,date,time,note,createdAt:Date.now(),status:'pending',source:'chatbot-wa'}); }catch(e){}

function clearChat(){

// ══════ TOAST ══════
function toast(msg, type='info'){
  const t = document.getElementById('agentToast');
  t.textContent = msg;
  t.style.background = type==='error'?'rgba(231,76,60,0.95)':type==='success'?'rgba(46,204,113,0.95)':'rgba(108,99,255,0.95)';
  t.style.color = 'white';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

// ══════ HELPERS ══════
function formatText(text){
  return text
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/\n/g,'<br>');
}
function escapeHtml(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function getTime(){ return new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}); }
function scrollToBottom(){ const m=document.getElementById('messages'); m.scrollTop=m.scrollHeight; }
function handleKey(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }
function autoResize(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }
function waitFor(fn,timeout=4000){
  return new Promise((res,rej)=>{
    if(fn()){res();return;}
    const start=Date.now();
    const t=setInterval(()=>{
      if(fn()){clearInterval(t);res();}
      else if(Date.now()-start>timeout){clearInterval(t);rej(new Error('Firebase timeout'));}
    },100);
  });
}
