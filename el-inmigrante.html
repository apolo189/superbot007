<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>El Inmigrante — Capítulo 1</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #111;
  font-family: Georgia, serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* ═══ INTRO ═══ */
#intro {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, #1a0000 0%, #000 70%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
  text-align: center;
  padding: 2em;
}

.logo {
  font-family: Impact, 'Arial Black', sans-serif;
  font-size: clamp(3rem, 12vw, 6rem);
  color: #cc0000;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  text-shadow: 4px 4px 0 #000, 0 0 40px rgba(200,0,0,0.5);
  line-height: 1;
  margin-bottom: 10px;
}

.cap-label {
  color: #444;
  font-size: clamp(0.8rem, 2.5vw, 1rem);
  letter-spacing: 0.4em;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.cap-title {
  color: #fff;
  font-size: clamp(1rem, 3.5vw, 1.5rem);
  font-style: italic;
  margin-bottom: 30px;
  color: #aaa;
}

.start-btn {
  background: #cc0000;
  color: #fff;
  border: none;
  padding: 15px 50px;
  font-family: Impact, sans-serif;
  font-size: clamp(1rem, 3vw, 1.3rem);
  letter-spacing: 0.3em;
  cursor: pointer;
  box-shadow: 5px 5px 0 #800000;
  transition: all 0.15s;
}
.start-btn:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 #800000; }
.start-btn:active { transform: translate(2px,2px); box-shadow: 3px 3px 0 #800000; }

/* ═══ BOOK SCENE ═══ */
#scene {
  display: none;
  width: 100vw;
  height: 100vh;
  position: relative;
  align-items: center;
  justify-content: center;
  background: #0a0a0a;
}

#scene.active { display: flex; }

/* ═══ BOOK ═══ */
#book {
  position: relative;
  width: min(85vw, 420px);
  height: min(88vh, 620px);
  perspective: 1500px;
}

/* ═══ PAGE ═══ */
.page {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transform-origin: left center;
  transition: transform 0.7s cubic-bezier(0.5, 0, 0.3, 1);
  cursor: pointer;
}

.page.flipped {
  transform: rotateY(-180deg);
}

.page-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  overflow: hidden;
  border-radius: 2px 8px 8px 2px;
  box-shadow: 5px 0 20px rgba(0,0,0,0.6);
}

.page-face.back {
  transform: rotateY(180deg);
  border-radius: 8px 2px 2px 8px;
  box-shadow: -5px 0 20px rgba(0,0,0,0.6);
}

.page-face img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Page spine shadow */
.page::before {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: -3px;
  width: 6px;
  background: linear-gradient(to right, #000, #333, #000);
  z-index: 10;
  transform-style: preserve-3d;
}

/* ═══ CLIFFHANGER PAGE ═══ */
.cliff-page {
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
  text-align: center;
  border: 3px solid #cc0000;
}

.cliff-quote {
  color: #fff;
  font-size: clamp(0.9rem, 3vw, 1.2rem);
  font-style: italic;
  line-height: 1.6;
  margin-bottom: 25px;
  border-left: 3px solid #cc0000;
  padding-left: 15px;
  text-align: left;
}

.cliff-quote em { color: #cc0000; font-style: normal; font-family: Impact, sans-serif; }

.cliff-next {
  color: #444;
  font-size: 0.65rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-bottom: 25px;
}

.cta-btn {
  background: #cc0000;
  color: #fff;
  border: none;
  padding: 12px 25px;
  font-family: Impact, sans-serif;
  font-size: clamp(0.85rem, 2.5vw, 1rem);
  letter-spacing: 0.2em;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  box-shadow: 4px 4px 0 #800000;
  margin-top: 10px;
}

/* ═══ CONTROLS ═══ */
#controls {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 56px;
  background: rgba(0,0,0,0.95);
  border-top: 1px solid #222;
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  gap: 10px;
  z-index: 100;
}

#controls.active { display: flex; }

.nav-arrow {
  background: none;
  border: 1.5px solid #333;
  color: #555;
  width: 38px; height: 38px;
  border-radius: 50%;
  font-size: 1.3rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.nav-arrow:hover:not(:disabled) { border-color: #cc0000; color: #cc0000; }
.nav-arrow:disabled { opacity: 0.2; }

#audio-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  justify-content: center;
}

.play-btn {
  background: #cc0000;
  border: none;
  color: #fff;
  width: 34px; height: 34px;
  border-radius: 50%;
  font-size: 0.85rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

#progress {
  flex: 1;
  max-width: 120px;
  height: 3px;
  background: #222;
  border-radius: 2px;
  cursor: pointer;
  position: relative;
}

#progress-fill {
  height: 100%;
  background: #cc0000;
  border-radius: 2px;
  width: 0%;
  pointer-events: none;
}

#page-counter {
  color: #333;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  flex-shrink: 0;
  min-width: 40px;
  text-align: right;
}

/* Music btn */
.music-btn {
  background: none;
  border: 1px solid #222;
  color: #444;
  padding: 4px 8px;
  font-size: 0.65rem;
  cursor: pointer;
  letter-spacing: 0.1em;
  flex-shrink: 0;
}
.music-btn.on { border-color: #cc0000; color: #cc0000; }

/* ═══ HINT ═══ */
#hint {
  position: fixed;
  bottom: 65px;
  left: 50%;
  transform: translateX(-50%);
  color: #333;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  pointer-events: none;
  animation: fadeHint 3s forwards 2s;
}

@keyframes fadeHint {
  0% { opacity:1; }
  100% { opacity:0; }
}

/* ═══ PAGE TURN SHADOW ═══ */
.page-shadow {
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, rgba(0,0,0,0.4), transparent 30%);
  pointer-events: none;
  border-radius: 2px 8px 8px 2px;
}

</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <div class="logo">El Inmigrante</div>
  <div class="cap-label">Capítulo I</div>
  <div class="cap-title">"El Último Dólar"</div>
  <button class="start-btn" onclick="startComic()">▶ LEER AHORA</button>
</div>

<!-- BOOK SCENE -->
<div id="scene">
  <div id="book">

    <!-- PAGE 0: COVER → P1 -->
    <div class="page" id="p0" style="z-index:4" onclick="nextPage()">
      <div class="page-face">
        <img src="comic_cover.jpg" alt="Portada">
        <div class="page-shadow"></div>
      </div>
      <div class="page-face back">
        <img src="comic_p1.jpg" alt="Página 1">
      </div>
    </div>

    <!-- PAGE 1: P2 → P3 -->
    <div class="page" id="p1" style="z-index:3" onclick="nextPage()">
      <div class="page-face">
        <img src="comic_p2.jpg" alt="Página 2">
        <div class="page-shadow"></div>
      </div>
      <div class="page-face back">
        <img src="comic_p3.jpg" alt="Página 3">
      </div>
    </div>

    <!-- PAGE 2: CLIFFHANGER -->
    <div class="page" id="p2" style="z-index:2">
      <div class="page-face cliff-page">
        <div class="cliff-quote">
          "El trabajo que ese hombre<br>le ofrecía...<br><br>
          <em>...no era exactamente legal."</em>
        </div>
        <div class="cliff-next">¿Qué decidió Miguel?<br><br>CONTINÚA EN → CAPÍTULO II: "LA TRAMPA"</div>
        <a href="https://apolo189.github.io/superbot007/agent.html" class="cta-btn">HABLAR CON MIGUEL →</a>
      </div>
    </div>

  </div>
</div>

<!-- HINT -->
<div id="hint" style="display:none">TAP O → PARA PASAR PÁGINA</div>

<!-- CONTROLS -->
<div id="controls">
  <button class="nav-arrow" id="btn-prev" onclick="prevPage()" disabled>‹</button>
  <div id="audio-controls">
    <button class="play-btn" id="play-btn" onclick="toggleAudio()">▶</button>
    <div id="progress" onclick="seekAudio(event)">
      <div id="progress-fill"></div>
    </div>
    <button class="music-btn" id="music-btn" onclick="toggleMusic()">♪</button>
  </div>
  <span id="page-counter">1/3</span>
  <button class="nav-arrow" id="btn-next" onclick="nextPage()">›</button>
</div>

<audio id="narration" preload="auto" src="comic_audio_v4.mp3"></audio>
<audio id="music" preload="auto" src="comic_music.mp3" loop></audio>

<script>
  const TOTAL = 3;
  let cur = 0;
  let flipping = false;
  const narration = document.getElementById('narration');
  const music = document.getElementById('music');
  music.volume = 0.18;

  function startComic() {
    document.getElementById('intro').style.display = 'none';
    document.getElementById('scene').classList.add('active');
    document.getElementById('controls').classList.add('active');
    document.getElementById('hint').style.display = 'block';
    updateUI();
    // Auto-play music
    music.play().catch(()=>{});
    document.getElementById('music-btn').classList.add('on');
  }

  function nextPage() {
    if(flipping || cur >= TOTAL - 1) return;
    flipping = true;
    playFlipSound();
    document.getElementById(`p${cur}`).classList.add('flipped');
    cur++;
    setTimeout(() => { flipping = false; updateUI(); }, 750);
  }

  function prevPage() {
    if(flipping || cur <= 0) return;
    flipping = true;
    playFlipSound();
    cur--;
    document.getElementById(`p${cur}`).classList.remove('flipped');
    setTimeout(() => { flipping = false; updateUI(); }, 750);
  }

  function updateUI() {
    document.getElementById('btn-prev').disabled = cur === 0;
    document.getElementById('btn-next').disabled = cur === TOTAL - 1;
    document.getElementById('page-counter').textContent = `${cur+1}/${TOTAL}`;
    // Update z-index for proper stacking
    for(let i = 0; i < TOTAL; i++) {
      const p = document.getElementById(`p${i}`);
      if(p) p.style.zIndex = TOTAL - i;
    }
  }

  // AUDIO
  function toggleAudio() {
    if(narration.paused) {
      narration.play();
      document.getElementById('play-btn').textContent = '⏸';
    } else {
      narration.pause();
      document.getElementById('play-btn').textContent = '▶';
    }
  }

  // Narration timestamps per page (seconds) — synced to script
  // Page 0 (Portada): 0s-5s
  // Page 1 (Llegada): 5s-28s  
  // Page 2 (Rechazo): 28s-50s
  // Page 3 (Hombre misterioso): 50s-70s
  const pageTimes = [0, 10, 55, 100]; // Ajustado para v4 (150s total)

  narration.addEventListener('timeupdate', () => {
    if(narration.duration) {
      const pct = (narration.currentTime / narration.duration) * 100;
      document.getElementById('progress-fill').style.width = pct + '%';
      // Auto page turn synced to narration
      let targetPage = 0;
      for(let i = pageTimes.length - 1; i >= 0; i--) {
        if(narration.currentTime >= pageTimes[i]) { targetPage = i; break; }
      }
      if(targetPage > cur && !flipping) nextPage();
    }
  });

  narration.addEventListener('ended', () => {
    document.getElementById('play-btn').textContent = '▶';
  });

  function seekAudio(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    narration.currentTime = pct * (narration.duration || 0);
  }

  let musicOn = true;
  function toggleMusic() {
    musicOn = !musicOn;
    const btn = document.getElementById('music-btn');
    if(musicOn) { music.play().catch(()=>{}); btn.classList.add('on'); }
    else { music.pause(); btn.classList.remove('on'); }
  }

  // Flip sound
  function playFlipSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const buf = ctx.createBuffer(1, ctx.sampleRate * 0.12, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i = 0; i < d.length; i++) {
        d[i] = (Math.random()*2-1) * Math.exp(-i/(ctx.sampleRate*0.025)) * 0.4;
      }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start();
    } catch(e){}
  }

  // Keyboard
  document.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextPage(); }
    if(e.key === 'ArrowLeft') prevPage();
    if(e.key === 'p') toggleAudio();
    if(e.key === 'm') toggleMusic();
  });

  // Swipe
  let tx = 0;
  document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', e => {
    const d = tx - e.changedTouches[0].clientX;
    if(Math.abs(d) > 50) d > 0 ? nextPage() : prevPage();
  }, {passive:true});
</script>
</body>
</html>
