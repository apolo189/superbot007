<script>
(function(){
  if("serviceWorker" in navigator){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){ r.unregister(); });
    });
  }
  if(window.caches){
    caches.keys().then(function(keys){
      keys.forEach(function(k){ caches.delete(k); });
    });
  }
})();
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#6C63FF;--s:#FF6584;--a:#43E97B;
  --dark:#000000;
  --card:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.10);
  --text:#F0F0FF;--muted:#7777AA;
  --glow:rgba(108,99,255,0.5);
  --grad:linear-gradient(135deg,var(--p),var(--s));
}
html,body{
  min-height:100vh;
  background:#000000 !important;
  color:var(--text);
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
}

/* ── CANVAS ── */
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;background:#000000}

/* ── LOADING ── */
#loadingScreen{
  position:fixed;inset:0;background:#000000;
  display:flex;align-items:center;justify-content:center;
  z-index:9999;transition:opacity 0.7s ease;
}
#loadingScreen.hide{opacity:0;pointer-events:none}
.loader-ring{
  width:52px;height:52px;
  border:3px solid rgba(255,255,255,0.06);
  border-top-color:var(--p);
  border-radius:50%;animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── WRAPPER ── */
.card-wrapper{
  position:relative;z-index:1;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:1.5rem 1rem 3rem;
}

/* ── MAIN CARD ── */
.card{
  width:100%;max-width:430px;
  background:rgba(8,8,8,0.88);
  backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);
  border:1px solid var(--border);
  border-radius:32px;
  overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04),
    0 40px 100px rgba(0,0,0,0.95),
    inset 0 1px 0 rgba(255,255,255,0.08);
  animation:cardIn 0.9s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(50px) scale(0.95)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* ── HERO ── */
.card-hero{
  position:relative;height:190px;overflow:hidden;
  background:linear-gradient(135deg,var(--p),var(--s));
}
.hero-pattern{
  position:absolute;inset:0;opacity:0.07;
  background-image:radial-gradient(circle,#fff 1px,transparent 1px);
  background-size:22px 22px;
}
.hero-glow{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 50% at 50% -10%,rgba(255,255,255,0.22),transparent);
}
.hero-shine{
  position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:conic-gradient(from 0deg,transparent,rgba(255,255,255,0.07) 60deg,transparent 120deg);
  animation:shine 10s linear infinite;
}
@keyframes shine{to{transform:rotate(360deg)}}
.hero-scanline{
  position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);
  pointer-events:none;
}
/* Corner neon accents */
.hero-corner-tl,.hero-corner-br{
  position:absolute;width:60px;height:60px;
  border:2px solid rgba(255,255,255,0.25);
  pointer-events:none;
}
.hero-corner-tl{top:14px;left:14px;border-right:none;border-bottom:none;border-radius:8px 0 0 0}
.hero-corner-br{bottom:14px;right:14px;border-left:none;border-top:none;border-radius:0 0 8px 0}

/* ── LOGO ── */
.logo-wrap{
  position:absolute;bottom:-44px;left:50%;transform:translateX(-50%);
  width:88px;height:88px;border-radius:26px;
  background:#000;
  border:3px solid rgba(255,255,255,0.14);
  box-shadow:0 8px 40px rgba(0,0,0,0.8),0 0 24px var(--glow);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;cursor:pointer;
  transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1),box-shadow 0.35s;
}
.logo-wrap:hover{
  transform:translateX(-50%) scale(1.12) rotate(-4deg);
  box-shadow:0 18px 55px rgba(0,0,0,0.9),0 0 36px var(--glow);
}
.logo-wrap img{width:100%;height:100%;object-fit:cover}
.logo-fallback{font-size:2.4rem}

/* ── BODY ── */
.card-body{padding:3.4rem 1.6rem 2rem;text-align:center}

/* ── ONLINE BADGE ── */
.online-badge{
  display:inline-flex;align-items:center;gap:0.45rem;
  font-size:0.68rem;font-weight:700;color:#43E97B;
  letter-spacing:0.08em;text-transform:uppercase;
  margin-bottom:1rem;
}
.online-dot{
  width:7px;height:7px;border-radius:50%;background:#43E97B;
  animation:dotPulse 2s ease infinite;
}
@keyframes dotPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(67,233,123,0.7)}
  50%{box-shadow:0 0 0 7px rgba(67,233,123,0)}
}

/* ── TYPEWRITER ── */
.tw-cursor{
  display:inline-block;
  width:2px;height:1em;
  background:var(--p);
  vertical-align:text-bottom;
  margin-left:2px;
  animation:twBlink 0.75s step-end infinite;
}
@keyframes twBlink{0%,100%{opacity:1}50%{opacity:0}}

/* Gradient-text typewriter: the inner span carries the visible text
   while the outer div provides the gradient clip */
.biz-name .tw-text{
  display:inline;
  -webkit-background-clip:inherit;
  background-clip:inherit;
  -webkit-text-fill-color:inherit;
}
.biz-name .tw-cursor{
  /* cursor uses solid color so it's visible over gradient parent */
  background:var(--s);
  -webkit-text-fill-color:initial;
}

/* ── BIZ NAME ── */
.biz-name{
  font-size:1.7rem;font-weight:900;letter-spacing:-0.02em;
  background:var(--grad);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:0.5rem;line-height:1.2;min-height:2.2rem;
  word-break:break-word;
}

/* ── TYPE BADGE ── */
.biz-type{
  display:inline-block;
  font-size:0.76rem;font-weight:700;color:var(--muted);
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  padding:0.3rem 0.9rem;border-radius:20px;margin-bottom:0.7rem;
  text-transform:uppercase;letter-spacing:0.08em;min-height:1.8rem;
}

/* ── CITY ── */
.biz-city{
  font-size:0.83rem;color:var(--muted);
  margin-bottom:0.8rem;
  display:flex;align-items:center;justify-content:center;gap:0.35rem;
}

/* ── DESC ── */
.biz-desc{
  font-size:0.8rem;color:var(--muted);line-height:1.7;
  margin-bottom:1.4rem;padding:0 0.3rem;
  max-height:5rem;overflow:hidden;
  mask-image:linear-gradient(to bottom,black 60%,transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom,black 60%,transparent 100%);
}

/* ── ACTION BTNS ── */
.action-row{display:flex;gap:0.6rem;justify-content:center;margin-bottom:1.5rem;flex-wrap:wrap}
.action-btn{
  display:flex;flex-direction:column;align-items:center;gap:0.3rem;
  width:72px;padding:0.9rem 0.4rem;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);border-radius:18px;
  cursor:pointer;text-decoration:none;color:var(--text);
  font-size:0.62rem;font-weight:700;letter-spacing:0.03em;
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  position:relative;overflow:hidden;
}
.action-btn::before{
  content:'';position:absolute;inset:0;background:var(--grad);
  opacity:0;transition:opacity 0.25s;border-radius:inherit;
}
.action-btn:hover{transform:translateY(-6px) scale(1.1);box-shadow:0 16px 36px var(--glow)}
.action-btn:hover::before{opacity:0.14}
.action-btn:active{transform:scale(0.96)}
.action-btn i{font-size:1.4rem;transition:transform 0.28s;z-index:1;position:relative}
.action-btn span{z-index:1;position:relative}
.action-btn:hover i{transform:scale(1.2)}
.action-btn.wa i{color:#25D366}
.action-btn.wa:hover{border-color:#25D366;box-shadow:0 16px 36px rgba(37,211,102,0.45)}
.action-btn.call i{color:var(--a)}
.action-btn.mail i{color:var(--s)}
.action-btn.web i{color:var(--p)}
.action-btn.ig i{color:#E1306C}
.action-btn.fb i{color:#1877F2}
.action-btn.tk i{color:#69C9D0}
.action-btn.yt i{color:#FF0000}

/* ── DIVIDER / SECTION TITLE ── */
.section-divider{
  display:flex;align-items:center;gap:0.75rem;
  margin:1.4rem 0 0.9rem;
  color:var(--p);font-size:0.7rem;font-weight:800;
  text-transform:uppercase;letter-spacing:0.14em;
  min-height:1.2rem;
}
.section-divider::before,.section-divider::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(to right,transparent,var(--border),transparent);
}

/* ── SERVICES ── */
.services-grid{display:flex;flex-direction:column;gap:0.45rem;margin-bottom:0.3rem}
.svc-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:0.7rem 1rem;
  background:rgba(255,255,255,0.025);
  border:1px solid var(--border);border-radius:13px;
  font-size:0.84rem;cursor:default;
  transition:all 0.24s;
}
.svc-item:hover{
  background:rgba(255,255,255,0.065);
  border-color:var(--p);
  transform:translateX(5px);
  box-shadow:0 2px 14px var(--glow);
}
.svc-name{font-weight:600;display:flex;align-items:center;gap:0.45rem}
.svc-price{
  font-size:0.8rem;font-weight:800;
  background:var(--grad);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* ── SOCIAL ── */
.social-row{display:flex;gap:0.55rem;justify-content:center;flex-wrap:wrap;margin-bottom:0.3rem}

/* ── QR SECTION ── */
.qr-section{margin-top:1.5rem}
.qr-box{
  display:flex;flex-direction:column;align-items:center;gap:0.85rem;
  padding:1.4rem;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);border-radius:20px;
}
.qr-box p{font-size:0.72rem;color:var(--muted);font-weight:600;letter-spacing:0.05em;text-align:center}
#qrCanvas{
  border-radius:14px;
  padding:10px;background:#fff;
  box-shadow:0 4px 24px rgba(0,0,0,0.6),0 0 16px var(--glow);
}

/* ── CTA ── */
.cta-section{margin-top:1.4rem;display:flex;flex-direction:column;gap:0.65rem}
.cta-btn{
  display:flex;align-items:center;justify-content:center;gap:0.6rem;
  padding:1rem 1.2rem;border-radius:16px;
  font-weight:800;font-size:0.88rem;cursor:pointer;
  text-decoration:none;border:none;
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  position:relative;overflow:hidden;
  letter-spacing:0.02em;
}
.cta-btn::after{
  content:'';position:absolute;top:-50%;left:-70%;
  width:45%;height:200%;
  background:rgba(255,255,255,0.18);
  transform:skewX(-20deg);
  transition:left 0.45s;
}
.cta-btn:hover::after{left:130%}
.cta-btn.primary{background:var(--grad);color:#fff;box-shadow:0 6px 26px var(--glow)}
.cta-btn.primary:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 16px 44px var(--glow)}
.cta-btn.secondary{
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);color:var(--text);
}
.cta-btn.secondary:hover{
  background:rgba(255,255,255,0.08);
  border-color:var(--p);transform:translateY(-2px);
}
.cta-btn.wa-cta{
  background:linear-gradient(135deg,#25D366,#128C7E);
  color:#fff;box-shadow:0 6px 24px rgba(37,211,102,0.4);
}
.cta-btn.wa-cta:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 16px 44px rgba(37,211,102,0.55)}

/* ── SHARE ROW ── */
.share-row{display:flex;gap:0.5rem;margin-top:1rem}
.share-btn-sm{
  flex:1;display:flex;align-items:center;justify-content:center;gap:0.38rem;
  padding:0.65rem 0.3rem;border-radius:12px;
  font-size:0.72rem;font-weight:700;
  cursor:pointer;border:1px solid var(--border);
  background:rgba(255,255,255,0.03);color:var(--muted);
  text-decoration:none;transition:all 0.22s;letter-spacing:0.03em;
}
.share-btn-sm:hover{border-color:var(--p);color:var(--text);background:rgba(255,255,255,0.07);transform:translateY(-2px)}

/* ── POWERED ── */
.powered{
  text-align:center;margin-top:1.6rem;padding-top:1.1rem;
  border-top:1px solid var(--border);
  font-size:0.7rem;color:var(--muted);
}
.powered a{
  text-decoration:none;font-weight:800;
  background:var(--grad);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

/* ── NO BOT ── */
.no-bot{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:60vh;
  gap:1rem;text-align:center;padding:2rem;
}
.no-bot h2{font-size:1.4rem;font-weight:800}
.no-bot p{color:var(--muted);font-size:0.88rem}

/* ── TOAST ── */
#cardToast{
  position:fixed;bottom:2rem;left:50%;
  transform:translateX(-50%) translateY(120px);
  padding:0.85rem 1.5rem;border-radius:14px;
  font-size:0.84rem;font-weight:700;
  z-index:9999;
  transition:transform 0.45s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events:none;white-space:nowrap;
  background:rgba(67,233,123,0.14);
  border:1px solid rgba(67,233,123,0.4);
  color:#43E97B;
}
#cardToast.show{transform:translateX(-50%) translateY(0)}

/* ── RESPONSIVE ── */
@media(max-width:400px){
  .card-body{padding:3rem 1.1rem 1.6rem}
  .biz-name{font-size:1.35rem}
  .action-btn{width:62px}
}
</style>

<script>
// ═══════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════
(function(){
  const cv=document.getElementById('bgCanvas'), ctx=cv.getContext('2d');
  let W,H,pts=[];
  function sz(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  window.addEventListener('resize',sz); sz();

  function getCols(){
    const s=getComputedStyle(document.documentElement);
    return [
      s.getPropertyValue('--p').trim()||'#6C63FF',
      s.getPropertyValue('--s').trim()||'#FF6584',
      s.getPropertyValue('--a').trim()||'#43E97B'
    ];
  }
  function mkPt(cols){
    return{x:Math.random()*W,y:Math.random()*H,
           r:Math.random()*1.8+0.4,
           vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,
           a:Math.random()*.3+.06,
           c:cols[Math.floor(Math.random()*cols.length)]};
  }
  function init(){const c=getCols();pts=Array.from({length:100},()=>mkPt(c));}
  init(); window.reinitParticles=init;

  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      // convert hex color + alpha
      let col=p.c.trim();
      if(col.length===7){ // #RRGGBB
        const hex=Math.floor(p.a*255).toString(16).padStart(2,'0');
        ctx.fillStyle=col+hex;
      } else {
        ctx.globalAlpha=p.a;
        ctx.fillStyle=col;
        ctx.fill();
        ctx.globalAlpha=1;
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<0)p.x=W; if(p.x>W)p.x=0;
        if(p.y<0)p.y=H; if(p.y>H)p.y=0;
        return;
      }
      ctx.fill();
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=W; if(p.x>W)p.x=0;
      if(p.y<0)p.y=H; if(p.y>H)p.y=0;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ═══════════════════════════════════════

const params=new URLSearchParams(location.search);

function toast(msg,type='success'){
  const t=document.getElementById('cardToast');
  t.textContent=msg;
  const ok=type==='success';
  t.style.background=ok?'rgba(67,233,123,0.14)':'rgba(255,71,87,0.14)';
  t.style.borderColor=ok?'rgba(67,233,123,0.4)':'rgba(255,71,87,0.4)';
  t.style.color=ok?'#43E97B':'#FF4757';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

function waitFor(fn,ms=15000){
  return new Promise((ok,fail)=>{
    if(fn()){ok();return;}
    const s=Date.now();
    (function c(){fn()?ok():Date.now()-s>ms?fail(new Error('timeout')):setTimeout(c,100);})();
  });
}

// ═══════════════════════════════════════
//  TYPEWRITER ENGINE
// ═══════════════════════════════════════
const twQueue=[];
let twRunning=false;

/**
 * typewrite(el, text, speed, cb)
 * Animates text character by character inside `el`.
 * Appends a blinking cursor span, removes it when done.
 * Works for any element type (div, span, etc.)
 */
function typewrite(el, text, speed=40, cb){
  if(!el) { if(cb) cb(); return; }
  el.innerHTML='';

  // For gradient-text elements (-webkit-text-fill-color:transparent),
  // text nodes are invisible. Use an inner <span> that inherits the clip.
  const isGradientText = getComputedStyle(el).webkitTextFillColor === 'transparent'
    || el.style.webkitTextFillColor === 'transparent';

  let textHolder;
  if(isGradientText){
    textHolder = document.createElement('span');
    textHolder.className='tw-text';
    el.appendChild(textHolder);
  } else {
    textHolder = el;
  }

  const cursor=document.createElement('span');
  cursor.className='tw-cursor';
  el.appendChild(cursor);

  let i=0;
  function tick(){
    if(i<text.length){
      const ch=document.createTextNode(text[i++]);
      // insert before cursor (which lives directly on el)
      if(isGradientText){
        textHolder.appendChild(ch);
      } else {
        el.insertBefore(ch, cursor);
      }
      setTimeout(tick, speed + (Math.random()*18-9));
    } else {
      cursor.remove();
      if(cb) cb();
    }
  }
  tick();
}

// Sequential typewriter for section titles
// usage: queueTW(el, text, speed, delayMs)
function queueTW(el, text, speed, delay){
  twQueue.push({el,text,speed:speed||28,delay:delay||0});
  if(!twRunning) runTWQueue();
}
function runTWQueue(){
  if(!twQueue.length){twRunning=false;return;}
  twRunning=true;
  const {el,text,speed,delay}=twQueue.shift();
  setTimeout(()=>{
    typewrite(el,text,speed,runTWQueue);
  },delay);
}

// ═══════════════════════════════════════
//  APPLY COLORS FROM BOT
// ═══════════════════════════════════════
function applyColors(d){
  const r=document.documentElement.style;
  const p=(d.primaryColor||'#6C63FF').trim();
  const s=(d.secondaryColor||'#FF6584').trim();
  const a=(d.accentColor||'#43E97B').trim();
  r.setProperty('--p',p);
  r.setProperty('--s',s);
  r.setProperty('--a',a);
  // ALWAYS black background
  r.setProperty('--dark','#000000');
  document.documentElement.style.background='#000000';
  document.body.style.background='#000000';
  r.setProperty('--glow',p+'55');
  r.setProperty('--grad',`linear-gradient(135deg,${p},${s})`);
  // Hero gradient = bot colors
  const hero=document.getElementById('cardHero');
  if(hero) hero.style.background=`linear-gradient(135deg,${p},${s})`;
  // Logo glow
  const logo=document.getElementById('logoWrap');
  if(logo) logo.style.boxShadow=`0 8px 40px rgba(0,0,0,0.8),0 0 28px ${p}55`;
  // Loader ring color
  const ring=document.querySelector('.loader-ring');
  if(ring) ring.style.borderTopColor=p;
  // Reinit particles with new colors
  if(window.reinitParticles) setTimeout(window.reinitParticles,80);
}

// ═══════════════════════════════════════
//  LOAD FROM FIREBASE
// ═══════════════════════════════════════
let _cardLoaded=false;
async function loadCard(){
  if(_cardLoaded) return;  // prevent double-call
  _cardLoaded=true;
  if(!botId){showNoBot('no-id');return;}
  try{
    await waitFor(()=>window._fbReady||window.db);
    const snap=await window._fbGetDoc(window._fbDoc(window.db,'bots',botId));
    if(!snap.exists()){showNoBot('not-found');return;}
    botData=snap.data();
    renderCard(botData);
  }catch(e){
    console.error('loadCard error:',e);
    _cardLoaded=false; // allow retry
    showNoBot('error');
  }
}

function showNoBot(reason){
  document.getElementById('loadingScreen').classList.add('hide');
  const el=document.getElementById('noBotMsg');
  if(reason==='error'){
    el.innerHTML=`
      <div style="font-size:3rem">📡</div>
      <h2>Error de conexión</h2>
      <p>No se pudo conectar. Verifica tu internet e intenta de nuevo.</p>
      <button onclick="_cardLoaded=false;document.getElementById('loadingScreen').classList.remove('hide');el.style.display='none';loadCard();"
        style="margin-top:1rem;padding:0.75rem 1.5rem;background:var(--grad);color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:0.9rem;">
        🔄 Reintentar
      </button>`;
  } else if(reason==='not-found'){
    el.innerHTML=`
      <div style="font-size:3rem">😕</div>
      <h2>Tarjeta no encontrada</h2>
      <p>El Bot ID no existe o fue eliminado.</p>
      <a href="index.html" style="color:var(--p);text-decoration:none;font-weight:700">← Inicio</a>`;
  } else {
    el.innerHTML=`
      <div style="font-size:3rem">😕</div>
      <h2>Bot ID no especificado</h2>
      <p>Agrega <strong>?id=TU_BOT_ID</strong> en la URL.</p>
      <a href="index.html" style="color:var(--p);text-decoration:none;font-weight:700">← Inicio</a>`;
  }
  el.style.display='flex';
}

// ═══════════════════════════════════════
//  RENDER CARD
// ═══════════════════════════════════════
function renderCard(d){
  // 1 — Colors first (bot colors, black bg)
  applyColors(d);

  // 2 — Logo / emoji
  const logoWrap=document.getElementById('logoWrap');
  const fallback=document.getElementById('logoFallback');
  if(d.logoURL){
    const img=document.createElement('img');
    img.src=d.logoURL; img.alt='logo';
    img.onerror=()=>{img.remove();fallback.style.display='flex';};
    fallback.style.display='none';
    logoWrap.appendChild(img);
  } else {
    const emo={salon:'💇',spa:'🧖',restaurant:'🍽️',gym:'💪',veterinar:'🐾',
               caf:'☕',pizza:'🍕',delivery:'🚚',nail:'💅',barber:'✂️',
               construc:'🏗️',dog:'🐶',fitness:'🏋️',tienda:'🛍️',tech:'💻',
               dental:'🦷',medic:'🏥',boutique:'👗'};
    const t=(d.businessType||'').toLowerCase();
    let e='🏢';
    for(const[k,v] of Object.entries(emo)){if(t.includes(k)){e=v;break;}}
    fallback.textContent=e;
  }

  // 3 — Page title
  document.title=(d.businessName||'Digital Card')+' • Super Bot 007';

  // 4 — Show card, hide loader
  document.getElementById('mainCard').style.display='block';
  document.getElementById('loadingScreen').classList.add('hide');

  // 5 — Typewriter chain: name → type → rest
  const nameEl=document.getElementById('bizName');
  const typeEl=document.getElementById('bizType');

  typewrite(nameEl, (d.businessName||'Mi Negocio').toUpperCase(), 55, ()=>{
    typewrite(typeEl, (d.businessType||'Negocio').toUpperCase(), 38, ()=>{
      // City
      const cityEl=document.getElementById('bizCity');
      if(d.businessCity){
        cityEl.style.display='flex';
        cityEl.innerHTML=`<i class="fas fa-map-marker-alt" style="color:var(--s)"></i>`;
        const span=document.createElement('span');
        cityEl.appendChild(span);
        typewrite(span, d.businessCity, 32);
      }
      // Description — plain text (too long for typewriter)
      if(d.description){
        const descEl=document.getElementById('bizDesc');
        descEl.style.display='block';
        descEl.textContent=d.description;
      }
      // Build sections
      buildActionRow(d);
      buildServices(d);
      buildSocial(d);
      buildQR();
      buildCTA(d);
      buildShareRow(d);
    });
  });
}

// ═══════════════════════════════════════
//  ACTION ROW
// ═══════════════════════════════════════
function buildActionRow(d){
  const row=document.getElementById('actionRow');
  row.innerHTML='';
  const btns=[];
  if(d.phone)
    btns.push({cls:'call',icon:'fas fa-phone',lbl:'Llamar',href:`tel:${d.phone}`});
  if(d.whatsapp||d.phone){
    const wa=(d.whatsapp||d.phone||'').replace(/\D/g,'');
    const msg=encodeURIComponent(`Hola ${d.businessName||''}! Me gustaría más información.`);
    btns.push({cls:'wa',icon:'fab fa-whatsapp',lbl:'WhatsApp',href:`https://wa.me/${wa}?text=${msg}`});
  }
  if(d.email)
    btns.push({cls:'mail',icon:'fas fa-envelope',lbl:'Email',href:`mailto:${d.email}`});
  // Only show Web button if website is a real external URL (not an agent.html / bot link)
  if(d.website){
    const ws = d.website.trim();
    const wsUrl = ws.startsWith('http') ? ws : 'https://'+ws;
    const isInternalBot = wsUrl.includes('agent.html') || wsUrl.includes('landing.html') || wsUrl.includes('card.html');
    if(!isInternalBot)
      btns.push({cls:'web',icon:'fas fa-globe',lbl:'Web',href:wsUrl});
  }

  btns.forEach((b,idx)=>{
    const a=document.createElement('a');
    a.className=`action-btn ${b.cls}`;
    a.href=b.href; a.target='_blank'; a.rel='noopener';
    a.innerHTML=`<i class="${b.icon}"></i><span>${b.lbl}</span>`;
    a.style.opacity='0'; a.style.transform='translateY(22px)';
    row.appendChild(a);
    setTimeout(()=>{
      a.style.transition='opacity 0.4s ease, transform 0.45s cubic-bezier(0.34,1.56,0.64,1)';
      a.style.opacity='1'; a.style.transform='translateY(0)';
    }, idx*110+100);
  });
}

//  SERVICES
// ═══════════════════════════════════════
function buildServices(d){
  const svcs=(Array.isArray(d.services)?d.services:[]).filter(s=>s&&s.name);
  if(!svcs.length) return;
  const sec=document.getElementById('servicesSection');
  const grid=document.getElementById('servicesGrid');
  sec.style.display='block';

  // Typewriter on divider title
  const divEl=document.getElementById('svcDivider');
  queueTW(divEl,'⚡ Servicios',26,300);

  const emo={entren:'💪',spinning:'🚴',yoga:'🧘',funcional:'🏋️',zumba:'💃',
             pilates:'🤸',boxeo:'🥊',natacion:'🏊',corte:'✂️',color:'🎨',
             manicure:'💅',masaje:'💆',facial:'✨',pizza:'🍕',burger:'🍔',
             taco:'🌮',pollo:'🍗',sushi:'🍱',pasta:'🍝',dental:'🦷',
             limpieza:'🧹',pintura:'🖌️',plomer:'🔧',electr:'⚡'};

  grid.innerHTML=svcs.slice(0,6).map((s,i)=>{
    const n=(s.name||'').toLowerCase();
    let e='⭐';
    for(const[k,v] of Object.entries(emo)){if(n.includes(k)){e=v;break;}}
    return `<div class="svc-item" style="opacity:0;transform:translateX(-18px);transition:opacity 0.4s ease ${i*90+500}ms,transform 0.4s ease ${i*90+500}ms">
      <span class="svc-name">${e} ${s.name}</span>
      ${s.price?`<span class="svc-price">${s.price}</span>`:''}
    </div>`;
  }).join('');
  requestAnimationFrame(()=>{
    grid.querySelectorAll('.svc-item').forEach(el=>{
      setTimeout(()=>{el.style.opacity='1';el.style.transform='translateX(0)';},10);
    });
  });
}

// ═══════════════════════════════════════
//  SOCIAL
// ═══════════════════════════════════════
function buildSocial(d){
  const socials=[];
  if(d.instagram) socials.push({cls:'ig',icon:'fab fa-instagram',lbl:'Instagram',href:d.instagram.startsWith('http')?d.instagram:'https://instagram.com/'+d.instagram.replace('@','')});
  if(d.facebook)  socials.push({cls:'fb',icon:'fab fa-facebook',lbl:'Facebook',href:d.facebook.startsWith('http')?d.facebook:'https://facebook.com/'+d.facebook.replace('@','')});
  if(d.tiktok)    socials.push({cls:'tk',icon:'fab fa-tiktok',lbl:'TikTok',href:d.tiktok.startsWith('http')?d.tiktok:'https://tiktok.com/@'+d.tiktok.replace('@','')});
  if(d.youtube)   socials.push({cls:'yt',icon:'fab fa-youtube',lbl:'YouTube',href:d.youtube.startsWith('http')?d.youtube:'https://youtube.com/'+d.youtube});
  if(!socials.length) return;
  document.getElementById('socialSection').style.display='block';
  const row=document.getElementById('socialRow');
  row.innerHTML=socials.map(s=>`<a class="action-btn ${s.cls}" href="${s.href}" target="_blank" rel="noopener"><i class="${s.icon}"></i><span>${s.lbl}</span></a>`).join('');
  queueTW(document.getElementById('socialDivider'),'🌐 Redes Sociales',26,200);
}

// ═══════════════════════════════════════
//  QR CODE (bot primary color)
// ═══════════════════════════════════════
function buildQR(){
  const cardUrl=`${base}card.html?id=${botId}`;
  const sec=document.getElementById('qrSection');
  const container=document.getElementById('qrCanvas');
  sec.style.display='block';
  container.innerHTML='';

  const p=getComputedStyle(document.documentElement).getPropertyValue('--p').trim()||'#6C63FF';
  // Use dark color for QR modules (ensure readability on white bg)
  // Darken primary if too light
  new QRCode(container,{
    text: cardUrl,
    width: 168,
    height: 168,
    colorDark: p,
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });

  queueTW(document.getElementById('qrDivider'),'📲 Escanea mi QR',26,200);
}

//  CTA BUTTONS
// ═══════════════════════════════════════
function buildCTA(d){
  const sec=document.getElementById('ctaSection');
  sec.innerHTML='';
  if(d.whatsapp||d.phone){
    const wa=(d.whatsapp||d.phone||'').replace(/\D/g,'');
    const msg=encodeURIComponent(`Hola ${d.businessName||''}! Me gustaría agendar una cita.`);
    sec.innerHTML+=`<a class="cta-btn wa-cta" href="https://wa.me/${wa}?text=${msg}" target="_blank"><i class="fab fa-whatsapp"></i> Agendar por WhatsApp</a>`;
  }
  sec.innerHTML+=`<a class="cta-btn primary" href="${base}agent.html?id=${botId}" target="_blank"><i class="fas fa-robot"></i> Chatear con el Bot</a>`;
  // "Ver sitio" → real website if configured, otherwise landing page
  if(d.website){
    const ws = d.website.trim();
    const wsUrl = ws.startsWith('http') ? ws : 'https://'+ws;
    const isInternalBot = wsUrl.includes('agent.html') || wsUrl.includes('landing.html') || wsUrl.includes('card.html');
    if(!isInternalBot){
      sec.innerHTML+=`<a class="cta-btn secondary" href="${wsUrl}" target="_blank"><i class="fas fa-globe"></i> Visitar sitio web</a>`;

}

// ═══════════════════════════════════════
function copyCardLink(){
  const url=`${base}card.html?id=${botId}`;
  navigator.clipboard.writeText(url)
    .then(()=>toast('✅ Link copiado!'))
    .catch(()=>{
      const t=document.createElement('textarea');
      t.value=url;document.body.appendChild(t);t.select();
      document.execCommand('copy');t.remove();
      toast('✅ Link copiado!');
    });
}

// ═══════════════════════════════════════
//  DOWNLOAD VCF
// ═══════════════════════════════════════
function downloadVCF(){
  if(!botData){toast('Cargando...','error');return;}
  const d=botData;
  const name=d.businessName||'Mi Negocio';
  const phone=(d.phone||d.whatsapp||'').replace(/\D/g,'');
  const cardUrl=`${base}card.html?id=${botId}`;
  let vcf='BEGIN:VCARD\r\nVERSION:3.0\r\n';
  vcf+=`FN:${name}\r\nORG:${name}\r\n`;
  if(d.businessType) vcf+=`TITLE:${d.businessType}\r\n`;
  if(phone)  vcf+=`TEL;TYPE=CELL:+${phone}\r\n`;
  if(d.email) vcf+=`EMAIL:${d.email}\r\n`;
  if(d.website) vcf+=`URL:${d.website.startsWith('http')?d.website:'https://'+d.website}\r\n`;
  if(d.businessCity) vcf+=`ADR;TYPE=WORK:;;${d.businessCity};;;;\r\n`;
  vcf+=`URL;TYPE=CHATBOT:${cardUrl}\r\n`;
  if(d.logoURL) vcf+=`PHOTO;VALUE=URI:${d.logoURL}\r\n`;
  vcf+=`NOTE:Digital Card via Super Bot 007 ⚡\r\nEND:VCARD`;
  const blob=new Blob([vcf],{type:'text/vcard'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`${name.replace(/\s+/g,'-')}.vcf`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('📇 Contacto guardado!');
}

// ═══════════════════════════════════════
//  INIT — single call, event-driven
// ═══════════════════════════════════════
if(window._fbReady){
  // Firebase already ready (unlikely but safe)
  loadCard();
} else {
  // Wait for Firebase module to signal ready
  document.addEventListener('fbReady', loadCard, {once:true});
  // Fallback: also try after DOM ready in case event was missed
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', ()=>setTimeout(loadCard,200), {once:true});
  } else {
    setTimeout(loadCard, 200);
  }
}
